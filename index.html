<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0e0e16" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Roguelite Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0e16;
        /* Block browser gestures: scroll, pinch-zoom, double-tap zoom, pull-to-refresh. */
        touch-action: none;
        overscroll-behavior: none;
        /* Block iOS long-press callout and text selection. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        /* Keep the canvas clear of notches and the home indicator. */
        position: fixed;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #0e0e16;
        color: #e8e8f0;
        font: 600 18px/1.4 system-ui, sans-serif;
        text-align: center;
      }
      #rotate .icon {
        font-size: 48px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="icon">⟳</div>
      <div>기기를 가로로 돌려주세요</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
